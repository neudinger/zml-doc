<style>
  #zml-operations-study {
    --paper: light-dark(#fff, #0d0c14);
    --surface: light-dark(#f5f4f9, #1e1a2c);
    --ink: light-dark(#0c0c15, #f5f3fa);
    --muted-ink: light-dark(#474657, #bdb8cc);
    --rule: light-dark(#dce0ed, #383449);
    --active-ink: light-dark(#4800dc, #c6a5ff);
    --selected: light-dark(#f0e5ff, #2a2043);
    --space: 14px;
    color: var(--ink);
    font: 400 14px/1.48 system-ui,sans-serif;
  }
  #zml-operations-study[data-spacing="Roomy"] { --space: 20px; }
  #zml-operations-study .study-page, #zml-operations-study .study-page * { box-sizing: border-box; min-inline-size: 0; }
  #zml-operations-study [hidden] { display: none !important; }
  #zml-operations-study .sizing[hidden] {
    display: block !important; visibility: hidden; pointer-events: none; position: absolute;
    inset-block-start: 0; inline-size: var(--study-width);
  }
  #zml-operations-study h2, #zml-operations-study h3, #zml-operations-study h4, #zml-operations-study p, #zml-operations-study dl { margin: 0; }
  #zml-operations-study h2 { font: 700 clamp(23px, 3.7vw, 31px)/1.12 system-ui,sans-serif; letter-spacing: -.03em; }
  #zml-operations-study h3 { font: 650 16px/1.3 system-ui,sans-serif; }
  #zml-operations-study h4 { font-size: 14px; }
  #zml-operations-study .study-picker { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 0 90px 10px 0; }
  #zml-operations-study :is(.study-picker select, .study-page button, .study-page input, .study-page select) {
    max-inline-size: 100%; padding: 5px 9px; border: 1px solid var(--rule); border-radius: 5px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  #zml-operations-study .study-page button:is(:hover, [aria-pressed="true"]) {
    border-color: var(--active-ink); background: var(--selected); color: var(--active-ink);
  }
  #zml-operations-study .study-page :focus-visible { outline: 2px solid var(--active-ink); outline-offset: 2px; }
  #zml-operations-study .study-page {
    min-block-size: var(--study-height, 0px); background: var(--paper); border: 1px solid var(--rule);
    border-radius: 7px; overflow-wrap: anywhere;
  }
  #zml-operations-study .study-shot img { display: block; inline-size: 100%; block-size: auto; aspect-ratio: 1280 / 840; border-radius: 6px; }
  #zml-operations-study .baseline { display: grid; gap: 5px; padding: var(--space); }
  #zml-operations-study .product-bar, #zml-operations-study .section-bar {
    padding: 7px var(--space); display: flex; gap: 5px 11px; align-items: center; flex-wrap: wrap;
    border-block-end: 1px solid var(--rule); font-size: 12px;
  }
  #zml-operations-study .product-bar > strong { font-size: 15px; }
  #zml-operations-study .section-bar { background: var(--surface); color: var(--muted-ink); }
  #zml-operations-study :is(.product-bar, .section-bar) [aria-pressed="true"] { border-block-end-color: var(--active-ink); }
  #zml-operations-study .study-body { display: grid; grid-template-columns: 142px minmax(0,1fr) 118px; gap: var(--space); align-items: start; padding: var(--space); }
  #zml-operations-study .study-nav { display: grid; gap: 5px; color: var(--muted-ink); font-size: 12px; }
  #zml-operations-study .study-nav > * { padding: 4px 6px; }
  #zml-operations-study .study-nav a { color: inherit; text-decoration: none; }
  #zml-operations-study .study-nav a:hover { color: var(--active-ink); text-decoration: underline; }
  #zml-operations-study .study-nav [aria-current="page"] { background: var(--selected); border-inline-start: 2px solid var(--active-ink); color: var(--active-ink); }
  #zml-operations-study .study-article { display: grid; gap: var(--space); }
  #zml-operations-study :is(.study-section, .study-header, .study-detail) { display: grid; align-content: start; gap: 7px; }
  #zml-operations-study :is(.crumb, .study-note) { color: var(--muted-ink); font-size: 12px; }
  #zml-operations-study code { color: var(--active-ink); font: 12px/1.48 ui-monospace,Menlo,monospace; }
  #zml-operations-study .study-inline-code { padding: 2px 4px; border-radius: 3px; background: var(--surface); box-decoration-break: clone; }
  #zml-operations-study .study-options { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  #zml-operations-study .study-list { display: grid; gap: 5px; }
  #zml-operations-study .study-list button { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; text-align: start; }
  #zml-operations-study .study-list button span { color: var(--muted-ink); }
  #zml-operations-study .study-detail { padding: 9px 11px; border-inline-start: 2px solid var(--active-ink); background: var(--surface); }
  #zml-operations-study .study-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
  #zml-operations-study .study-lane { padding: 9px 11px; border: 1px solid var(--rule); border-radius: 5px; display: grid; align-content: start; gap: 7px; }
  #zml-operations-study ol { margin: 0; padding-inline-start: 1.6em; }
  #zml-operations-study li + li { margin-block-start: 5px; }
  #zml-operations-study dl > div { display: grid; grid-template-columns: minmax(76px,1fr) minmax(0,2fr); padding-block: 4px; gap: 4px 8px; border-block-end: 1px solid var(--rule); }
  #zml-operations-study dt { font-weight: 600; }
  #zml-operations-study dd { margin: 0; }
  #zml-operations-study table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #zml-operations-study th, #zml-operations-study td { border-block-end: 1px solid var(--rule); text-align: start; vertical-align: top; padding: 4px 5px; }
  #zml-operations-study th { color: var(--muted-ink); }
  #zml-operations-study details { border-block-end: 1px solid var(--rule); padding-block: 4px; }
  #zml-operations-study summary { color: var(--active-ink); padding: 4px 0; font-weight: 600; }
  #zml-operations-study .study-field { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; }
  #zml-operations-study .study-flow { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  #zml-operations-study .study-flow b { color: var(--active-ink); }
  #zml-operations-study .study-chip { display: inline-block; background: var(--surface); padding: 3px 5px; border-radius: 4px; }
  @media (max-width: 835px) {
    #zml-operations-study .study-body { grid-template-columns: 125px minmax(0,1fr); }
    #zml-operations-study .study-outline { display: none; }
  }
  @media (max-width: 585px) {
    #zml-operations-study :is(.study-body, .study-grid) { grid-template-columns: minmax(0,1fr); }
    #zml-operations-study .study-side { display: none; }
    #zml-operations-study .study-picker { margin-inline-end: 0; }
    #zml-operations-study .study-shot img { aspect-ratio: 390 / 620; }
  }
  @media (pointer: coarse) {
    #zml-operations-study :is(.study-picker select, .study-page button, .study-page select, .study-page input, .study-page summary) { min-block-size: 44px; }
    #zml-operations-study .study-page input { font-size: 16px; }
  }
</style>

<script>
(() => {
  const root = document.getElementById("zml-operations-study");
  const picker = root.querySelector("[data-milestone]");
  const frames = [...root.querySelectorAll("[data-variant]")];
  const labels = {
    m25: ["Operations overview","Operate deployments","Intro links → configuration → readiness → monitoring → rollback guidance"],
    m26: ["Deploy LLMD with Docker","Deploy LLMD with Docker","Prepare → start → verify → route traffic → upgrade or roll back"],
    m27: ["Hardware compatibility","Hardware compatibility","Shared introduction → ZML build table → LLMD artifacts → model evidence"],
    m28: ["Environment variables","Environment variables","Docker forwarding → credentials → proxies → reporting → diagnostics → backend settings"],
  };
  const designNames = {
    m25: ["Action index","Lifecycle map","Goal picker"],
    m26: ["Step + pass check","Upgrade runbook","Upgrade comparison"],
    m27: ["Product matrix","Backend inspector","Product comparison"],
    m28: ["Variable index","Provider sections","Precedence trace"],
  };
  const defaults = {task:"verify",upgrade:"spare",product:"llmd",backend:"metal",entry:"User Guide",variable:"hf",provider:"hf",token:"unset",query:""};
  let page = "m25";
  let selections = {};
  const escape = text => String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  const code = text => `<code class="study-inline-code">${escape(text)}</code>`;
  const note = text => `<p class="study-note">${text}</p>`;
  const section = (key, title, html) => ({key,title,html});
  const pane = html => `<div class="study-detail">${html}</div>`;
  const fields = rows => `<dl>${rows.map(([term,text]) => `<div><dt>${term}</dt><dd>${text}</dd></div>`).join("")}</dl>`;
  const table = (cols, rows) => `<table><thead><tr>${cols.map(col => `<th scope="col">${col}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row => `<tr><th scope="row">${row[0]}</th>${row.slice(1).map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const disclosure = (title, body) => `<details><summary class="cursor-interaction">${title}</summary>${body}</details>`;
  const button = (action, key, text, active) => `<button type="button" class="cursor-interaction" data-action="${action}" data-value="${key}" aria-pressed="${active === key}">${text}</button>`;
  const buttons = (action, label, options, active, layout="study-options") =>
    `<div class="${layout}" role="group" aria-label="${label}">${options.map(([key,name]) => button(action,key,name,active)).join("")}</div>`;
  const select = (action, label, options, active) => `<label class="study-field">${label}
    <select data-select="${action}">${options.map(([key,name]) => `<option value="${key}"${active === key ? " selected" : ""}>${name}</option>`).join("")}</select></label>`;

  const tasks = {
    deploy: ["Deploy","Start a Docker service","Prepare the host and model","deploy-llmd/#prepare-the-host-and-model","Record the image, accelerator, model revision, and launch flags."],
    verify: ["Verify","Check a running service","Verify readiness","deploy-llmd/#verify-readiness","Health returns OK, the expected model ID is listed, and a short inference request returns text."],
    diagnose: ["Diagnose","Investigate a failed check","Diagnose common failures","monitoring-and-troubleshooting/#diagnose-common-failures","Follow the container, listener, served model, and inference checks."],
    rollback: ["Roll back","Restore the previous release","Upgrade or roll back","deploy-llmd/#upgrade-or-roll-back","Use the retained container and model files. Verify inference before returning traffic."],
  };
  function operations(index, state) {
    const [label,,heading,reference,witness] = tasks[state.task];
    const destination = pane(`<h4>${heading}</h4><p>${witness}</p>${note("Destination " + code("/llmd/user-guide/operations/" + reference))}`);
    if (index === 1) return [section("actions","Operate LLMD", buttons("task","Operations tasks",
      Object.entries(tasks).map(([key,[title,goal]]) => [key,"<strong>"+title+"</strong><span>"+goal+"</span>"]), state.task, "study-list") + destination)];
    if (index === 2) return [section("lifecycle","Deployment lifecycle",
      `<div class="study-flow">${button("task","deploy","Deploy",state.task)}<b aria-hidden="true">→</b>
      ${button("task","verify","Verify",state.task)}<b aria-hidden="true">→</b><span class="study-chip">Route traffic</span></div>
      <div class="study-options"><span class="study-note">Failed check</span>${button("task","diagnose","Diagnose",state.task)}
        <span class="study-note">Regression after cutover</span>${button("task","rollback","Roll back",state.task)}</div>${destination}`)];
    return [section("goal","What are you doing?", select("task","Current task",
      Object.entries(tasks).map(([key,[,goal]]) => [key,goal]),state.task) + `<h4>${label}</h4>${destination}`)];
  }

  const deploySteps = [
    ["Prepare host & model","Check the NVIDIA driver, GPU access inside Docker, and the chosen model directory.","Docker sees the GPU and the model files match the recorded revision."],
    ["Start the container","Start "+code("zmlai/llmd:cuda")+" with a read-only model mount and the loopback port.","The process stays up and logs show model loading has completed."],
    ["Verify inference",code("GET /health")+" → "+code("GET /v1/models")+" → short chat request.","Health responds, the expected model ID is listed, and the completion contains text."],
    ["Route traffic","Use the client endpoint, through the proxy for remote access.","A chat request through that endpoint succeeds before opening it to clients."],
  ];
  const upgrades = {
    spare: {
      title:"Spare GPU",
      drain:"Start and verify the candidate on a separate GPU and port. Drain the old route at cutover after it passes.",
      retain:"Keep the previous container, original image, launch settings, and model revision or files.",
      restore:"Cut over and restore client traffic after the candidate passes an inference request through the client endpoint.",
      rollback:"Route back to the previous container. Start it if stopped, verify inference, then restore traffic.",
    },
    inplace: {
      title:"In-place replacement",
      drain:"Drain traffic before stopping the running container. Rename it to "+code("llmd-previous")+".",
      retain:"Keep "+code("llmd-previous")+", its original image, launch settings, and model files.",
      restore:"Start the candidate on the production port. Verify the served model and inference through the client endpoint, then restore traffic.",
      rollback:"Stop and remove the candidate. Rename and start the retained container, verify inference, then restore traffic.",
    },
  };
  const launchTable = () => table(["Step","Action","Pass condition"], deploySteps);
  const lane = upgrade => `<div class="study-lane"><h4>${upgrade.title}</h4>
    ${fields([["Drain",upgrade.drain],["Retain",upgrade.retain],["Restore traffic",upgrade.restore],["Roll back",upgrade.rollback]])}</div>`;
  function deployment(index,state) {
    const firstDeployment = section("deployment","First deployment",index===1 ? launchTable() : disclosure("Show steps and passing conditions",launchTable()));
    const selected = upgrades[state.upgrade];
    if (index === 1) return [firstDeployment,section("upgrade","Upgrade and rollback",
      disclosure("Spare GPU",lane(upgrades.spare))+disclosure("In-place replacement",lane(upgrades.inplace)))];
    if (index === 2) return [section("runbook","Upgrade runbook",buttons("upgrade","Upgrade path",
      [["spare","Spare GPU"],["inplace","In-place replacement"]],state.upgrade)+
      pane(`<h4>${selected.title}</h4><ol><li>${selected.retain}</li><li>${selected.drain}</li><li>${selected.restore}</li></ol>`)+
      pane(`<h4>Rollback</h4><p>${selected.rollback}</p>`)),firstDeployment];
    return [section("comparison","Compare upgrade paths",`<div class="study-grid">${Object.values(upgrades).map(lane).join("")}</div>`),firstDeployment];
  }

  const backendNames = {cpu:"CPU",cuda:"NVIDIA CUDA",rocm:"AMD ROCm",oneapi:"Intel oneAPI",tpu:"Google TPU",metal:"Apple Metal",neuron:"AWS Neuron",furiosa:"Furiosa RNGD"};
  const hostZml = {cpu:"Checkout toolchain and host target",cuda:"CUDA plugin and driver for the build target",rocm:"Linux x86-64",oneapi:"Linux x86-64",tpu:"Linux x86-64",metal:"macOS on Apple Silicon",neuron:"Linux x86-64",furiosa:"Linux x86-64"};
  const hostLlmd = {cuda:"Linux amd64 or arm64",rocm:"Linux amd64",oneapi:"Linux amd64",tpu:"Linux amd64 on a Google TPU VM",metal:"macOS Tahoe or later on Apple Silicon",furiosa:"Linux amd64"};
  const exampleModels = {cuda:"FP8",rocm:"FP8",metal:"FP8",oneapi:"BF16",tpu:"BF16"};
  const hosts = {zml:hostZml,llmd:hostLlmd};
  const productLabel = {zml:"ZML",llmd:"LLMD"};
  function action(product, backend) {
    if (product === "zml") return backend === "cpu" ? "Enabled by default" : code("--@zml//platforms:"+backend+"=true");
    return code(backend === "metal" ? "brew install zml/zml/llmd" : "zmlai/llmd:"+backend);
  }
  function publishedModel(backend) {
    const precision = exampleModels[backend];
    if (!precision) return "";
    return code("LiquidAI/LFM3-1.7B" + (precision === "FP8" ? "-FP8" : "")) + " · " + precision + " · Published LLMD 20261029.0 recipe";
  }
  function backendProfile(product,backend) {
    const llmd = product==="llmd";
    const rows = Object.hasOwn(hosts[product],backend) ?
      [["Host",hosts[product][backend]],[llmd?"Launch artifact":"Bazel build",action(product,backend)]] :
      [["Reference","No row in the current "+productLabel[product]+" table."]];
    if (llmd && publishedModel(backend)) rows.push(["Model evidence",publishedModel(backend)]);
    if (llmd && backend === "furiosa") rows.push(["Evidence","Docker recipe hardware validation pending."]);
    if (!llmd) rows.push(["Evidence","Pinned ZML platform build definitions."]);
    return fields(rows);
  }
  function hardware(index,state) {
    const product = state.product;
    const llmd = product==="llmd";
    const choices = index === 3 ? Object.keys(backendNames) : Object.keys(hosts[product]);
    const backend = choices.includes(state.backend) ? state.backend : "metal";
    if (index === 1) {
      const rows = choices.map(key => [
        backendNames[key],hosts[product][key],action(product,key) +
        (llmd && publishedModel(key) ? note(publishedModel(key)) : ""),
      ]);
      return [section("matrix","Backend requirements",table(["Backend","Host",llmd?"Launch and model evidence":"Bazel build setting"],rows)+
        (llmd ? "" : note("Source · Pinned ZML platform build definitions.")))];
    }
    const choose = select("backend","Backend",choices.map(key=>[key,backendNames[key]]),backend);
    if (index === 2) return [section("inspector","Backend inspector",choose+
      pane(`<h4>${backendNames[backend]} · ${productLabel[product]}</h4>${backendProfile(product,backend)}`))];
    const order = llmd ? ["llmd","zml"] : ["zml","llmd"];
    return [section("product-comparison","Build or serve on the same backend",choose+
      `<div class="study-grid">${order.map(key=>`<section class="study-lane"><h4>${key==="zml"?"Build with ZML":"Serve with LLMD"}</h4>
        ${backendProfile(key,backend)}</section>`).join("")}</div>`)];
  }

  const variables = {
    hf: {names:["HF_TOKEN"], group:"hf", defaultText:"Unset → token file → anonymous if unavailable.",
      precedence:"An explicit value, including an empty string, takes precedence over the token file.",
      example:"-e HF_TOKEN", usage:"Docker forwards the exported host value before the image name.",
    },
    s3key: {names:["AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY"], group:"s3", defaultText:"Anonymous if either key is unset.",
      precedence:"The loader uses both keys together to sign requests.",
      example:"-e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY", usage:"Forward exported credentials to Docker by name.",
    },
    s3endpoint: {names:["AWS_ENDPOINT_URL","AWS_ENDPOINT_URL_S3"], group:"s3", defaultText:"https://s3.amazonaws.com",
      precedence:"First set value wins, with AWS_ENDPOINT_URL first.",
      example:"export AWS_ENDPOINT_URL=https://s3.amazonaws.com",usage:"Set on the process that loads weights.",
    },
    s3region: {names:["AWS_REGION","AWS_DEFAULT_REGION"], group:"s3", defaultText:"us-east-1",
      precedence:"First set value wins, with AWS_REGION first.",
      example:"export AWS_REGION=us-east-1",usage:"Set on the host for a native launch.",
    },
    gcs: {names:["GOOGLE_APPLICATION_CREDENTIALS"], group:"gcs", defaultText:code("$HOME/.config/gcloud/application_default_credentials.json")+" → GCE metadata if available → anonymous.",
      precedence:"The explicit file path is tried when set.",
      example:"-e GOOGLE_APPLICATION_CREDENTIALS=/run/gcs-adc.json",usage:"Mount the credentials file read-only at /run/gcs-adc.json in the container.",
    },
    proxy: {names:["https_proxy","HTTPS_PROXY","all_proxy","ALL_PROXY"], group:"runtime", defaultText:"Direct connection.",
      precedence:"For the LLMD HTTPS client, first nonempty value in the order shown.",
      example:"export https_proxy=http://proxy.example:3128",usage:"Use the proxy address for the model-loading process.",
    },
    reporting: {names:["DO_NOT_TRACK"], group:"runtime", defaultText:"Unset unless configured.",
      precedence:"DO_NOT_TRACK=1 disables crash reporting and usage statistics in the reviewed build.",
      example:"-e DO_NOT_TRACK=1",usage:"Pass before the image name for a Docker launch.",
    },
    diagnostics: {names:["ZML_AUTOTUNE_CACHE_DIR"], group:"runtime", defaultText:"Unset.",
      precedence:"An explicit path selects the autotune cache directory on CUDA, ROCm, and oneAPI.",
      example:"-e ZML_AUTOTUNE_CACHE_DIR=/cache/zml",usage:"Mount a writable directory at /cache/zml to persist it.",
    },
  };
  const groups = {hf:"Hugging Face",s3:"S3",gcs:"Google Cloud Storage",runtime:"Runtime settings"};
  const varTitle = data => data.names.map(code).join(" ");
  function variableDetail(key) {
    const data = variables[key];
    return pane(`<h4>${varTitle(data)}</h4>${fields([
      ["Default",data.defaultText],["Precedence",data.precedence],["Example",code(data.example)],
    ])}${note(data.usage)}${key==="hf" ? note("Token file · "+code("$HOME/.cache/huggingface/token")+" in the loading process.") : ""}`);
  }
  function matchingVariables(query) {
    return Object.entries(variables).filter(([,item]) => (item.names.join(" ")+" "+groups[item.group]).toLowerCase().includes(query.trim().toLowerCase()));
  }
  function indexChoices(match, active) {
    return match.length ? buttons("variable","Variables",match.map(([key,item])=>[key,varTitle(item)]),active,"study-list") : note("No matching variable in this preview.");
  }
  const tokenStates = {
    set:["HF_TOKEN is set","Use the explicit value."],
    empty:["HF_TOKEN is set to an empty string","Use the explicit empty value. It suppresses the token-file fallback."],
    unset:["HF_TOKEN is unset","Try the loading process’s "+code("$HOME/.cache/huggingface/token")+". Use anonymous access if no token is available."],
  };
  function environment(index,state) {
    if (index === 1) return [section("lookup","Find a variable",`<label class="study-field">Variable or provider
      <input type="search" data-filter value="${escape(state.query)}" placeholder="HF_TOKEN"></label>
      <div class="study-grid"><div data-index-list>${indexChoices(matchingVariables(state.query),state.variable)}</div>
      <div data-variable-detail aria-live="polite">${matchingVariables(state.query).length ? variableDetail(state.variable) : ""}</div></div>`)];
    if (index === 2) return [section("provider","Choose a provider",buttons("provider","Provider",Object.entries(groups),state.provider)),
      section("variables",groups[state.provider],Object.entries(variables).filter(([,item])=>item.group===state.provider).map(([key])=>variableDetail(key)).join(""))];
    const [label,outcome]=tokenStates[state.token];
    return [section("precedence","HF_TOKEN precedence",buttons("token","Environment state",[["set","Set"],["empty","Explicitly empty"],["unset","Unset"]],state.token)+
      `<div class="study-flow"><span class="study-chip">${label}</span><b aria-hidden="true">→</b><span class="study-chip">${outcome}</span></div>`),
      section("forwarding","Forward to Docker",pane(`${code("-e HF_TOKEN")}<p>Pass before the image name. An exported value is forwarded, including an empty value. If the host variable is absent, it is unset in the container.</p>`)),
      section("related","Other variables",table(["Variable","Default"],Object.values(variables).slice(1,5).map(item=>[varTitle(item),item.defaultText])))];
  }

  const layouts = {m25:operations,m26:deployment,m27:hardware,m28:environment};
  const keySets = {
    task:Object.keys(tasks), upgrade:Object.keys(upgrades), product:Object.keys(productLabel), backend:Object.keys(backendNames),
    entry:["User Guide","CLI Reference"], variable:Object.keys(variables), provider:Object.keys(groups), token:Object.keys(tokenStates),
  };
  const at = index => selections[page]?.[index] ?? defaults;
  function renderFrame(index) {
    const state = at(index);
    const shared = page === "m27" || page === "m28";
    const product = shared ? productLabel[state.product] : "LLMD";
    const category = page === "m28" ? state.entry : "User Guide";
    const cli = category === "CLI Reference";
    const menu = cli ? (state.product === "llmd" ?
      ["Model and listener flags","Batching and memory","Sampling and decoding","Benchmarking (Work In Progress)","Environment variables","Docker options"] :
      ["ZML CLI reference","Environment variables"]) : shared ?
      ["Hardware compatibility","Environment variables"] : ["Operations overview","Deploy LLMD with Docker","Monitoring and troubleshooting"];
    const sections = layouts[page](index,state);
    const id = key => "ops-study-"+page+"-"+index+"-"+key;
    frames[index].innerHTML = `<div class="study-page">
      <div class="product-bar"><strong>ZML / documentation</strong>${shared ?
        buttons("product","Product",[["zml","ZML"],["llmd","LLMD"]],state.product) : "<span>ZML</span><strong>LLMD</strong>"}</div>
      <div class="section-bar">${page==="m28" ?
        buttons("entry","Documentation section",[["User Guide","User Guide"],["CLI Reference","CLI Reference"]],state.entry) :
        "<strong>User Guide</strong><span>Developer Guide</span><span>API Reference</span><span>CLI Reference</span>"}</div>
      <div class="study-body">
        <div class="study-nav study-side"><strong>${cli ? "CLI Reference" : shared ? "Reference" : "Operations"}</strong>${menu.map(title =>
          `<span${title===labels[page][0] ? ' aria-current="page"' : ''}>${title}</span>`).join("")}</div>
        <article class="study-article"><header class="study-header"><p class="crumb">${product} / ${category}${cli ? "" : shared ? " / Reference" : " / Operations"}</p>
          <h2>${labels[page][1]}</h2>${note(designNames[page][index-1])}</header>
          ${sections.map(item=>`<section class="study-section" id="${id(item.key)}"><h3>${item.title}</h3>${item.html}</section>`).join("")}</article>
        <nav class="study-nav study-outline" aria-label="On this page"><strong>On this page</strong>${sections.map(item=>
          `<a href="#${id(item.key)}">${item.title}</a>`).join("")}</nav>
      </div></div>`;
  }
  const sizes = {};
  function sizeFrames() {
    const visible = frames.find(frame=>!frame.hidden);
    const width = visible.getBoundingClientRect().width;
    sizes.width = width;
    root.style.setProperty("--study-width",width+"px");
    root.style.setProperty("--study-height","0px");
    for (const frame of frames) frame.classList.add("sizing");
    const height = Math.max(...frames.map(frame=>frame.firstElementChild.getBoundingClientRect().height));
    for (const frame of frames) frame.classList.remove("sizing");
    root.style.setProperty("--study-height",Math.ceil(height)+"px");
  }
  function render() {
    const [title,heading,structure] = labels[page];
    picker.value = page;
    const shot = root.querySelector(`template[data-current="${page}"]`).innerHTML;
    frames[0].innerHTML = `<div class="study-page">${shot}<div class="baseline"><h3>${title} · Current reading order</h3>
      <p>${structure}</p>${note("Current LLMD documentation · "+heading)}</div></div>`;
    for (let index=1;index<frames.length;index++) renderFrame(index);
    sizeFrames();
  }
  function save() {
    const saved = Object.fromEntries(Object.entries(selections).map(([key,variants]) => [key,
      Object.fromEntries(Object.entries(variants).map(([index,{query,...state}]) => [index,state])),
    ]));
    window.openai?.setWidgetState?.({modelContent:{kind:"operations-layouts-m25-m28",page},privateContent:{selections:saved}})?.catch(()=>{});
  }
  function restore(raw) {
    const data=raw?.modelContent??raw;
    if (data?.kind!=="operations-layouts-m25-m28" || !Object.hasOwn(labels,data.page)) return false;
    page=data.page;
    selections={};
    for(const key of Object.keys(labels)) {
      const input=raw?.privateContent?.selections?.[key];
      if (!input) continue;
      for (let index=1;index<frames.length;index++) {
        const active=input[index];
        if (!active) continue;
        const valid={...defaults};
        for(const field of Object.keys(keySets)) if(keySets[field].includes(active[field])) valid[field]=active[field];
        selections[key]??={};
        selections[key][index]=valid;
      }
    }
    return true;
  }
  function setState(index,action,value) {
    selections[page]??={};
    selections[page][index]={...at(index),[action]:value};
  }
  function changeControl(control,action,value) {
    const index=frames.indexOf(control.closest("[data-variant]"));
    if(index<1 || !keySets[action]?.includes(value)) return;
    setState(index,action,value);
    renderFrame(index);
    const match=frames[index].querySelector(`[data-action="${action}"][data-value="${value}"], [data-select="${action}"]`);
    match?.focus({preventScroll:true});
    sizeFrames();
    save();
  }
  root.addEventListener("click",event=>{
    const control=event.target.closest("[data-action]");
    if(control) changeControl(control,control.dataset.action,control.dataset.value);
  });
  root.addEventListener("change",event=>{
    if(event.target===picker) {page=picker.value;render();save();}
    else if(event.target.matches("[data-select]")) changeControl(event.target,event.target.dataset.select,event.target.value);
  });
  root.addEventListener("input",event=>{
    if(!event.target.matches("[data-filter]")) return;
    const frame=event.target.closest("[data-variant]");
    const index=frames.indexOf(frame);
    const value=event.target.value.slice(0,72);
    const matches=matchingVariables(value);
    const current=at(index).variable;
    const variable=matches.some(([key])=>key===current) ? current : matches[0]?.[0] ?? current;
    selections[page]??={};
    selections[page][index]={...at(index),query:value,variable};
    frame.querySelector("[data-index-list]").innerHTML=indexChoices(matches,variable);
    frame.querySelector("[data-variable-detail]").innerHTML=matches.length ? variableDetail(variable) : "";
    sizeFrames();
  });
  window.addEventListener("openai:set_globals",event=>{if(restore(event.detail?.globals?.widgetState)) render();});
  window.addEventListener("resize",()=>{if(frames.find(frame=>!frame.hidden).getBoundingClientRect().width!==sizes.width)sizeFrames();});
  restore(window.openai?.widgetState);
  render();
  if(globalThis.Tweak) {
    const settings={spacing:"Compact"};
    const tweak=new Tweak({container:root,onChange:()=>{root.dataset.spacing=settings.spacing;sizeFrames();}});
    tweak.addSelect(settings,"spacing",{label:"Article spacing",options:["Compact","Roomy"]});
  }
})();
</script>
