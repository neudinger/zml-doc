<!DOCTYPE html>
<html lang="en" data-theme="dark" data-pf-theme="dark">
<head id="site-head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0c14">
  <link rel="icon" type="image/svg+xml" href="$site.asset('zml-mark.svg').link()">
  <script src="$site.asset('site-theme.js').link()"></script>
  <ctx :if="$build.development.not()">
    <link rel="stylesheet" href="$site.index().link().addPath('pagefind/pagefind-component-ui.css')">
    <script type="module" src="$site.index().link().addPath('pagefind/pagefind-component-ui.js')"></script>
  </ctx>
  <link rel="stylesheet" href="$site.asset('site.css').link()">
  <script defer src="$site.asset('mobile-navigation.js').link()"></script>
  <ctx :if="$site.index().isCurrent().not()">
    <script defer src="$site.asset('docs-navigation.js').link()"></script>
  </ctx>
  <super>
</head>
<body class="$site.index().isCurrent().then('homepage', '')" data-site-root="$site.index().link()">
  <a class="skip-link" href="#site-content">Skip to content</a>
  <ctx :if="$build.development.not()">
    <pagefind-config base-url="$site.index().link()" bundle-path="$site.index().link().addPath('docs-search/')"></pagefind-config>
  </ctx>
  <header class="site-header">
    <div class="page-width header-inner">
      <a class="brand" href="$site.index().link()" aria-label="ZML documentation home">
        <img src="$site.asset('zml-mark.svg').link()" alt="" width="32" height="32">
        <strong>ZML</strong> <ctx :if="$site.index().isCurrent().not()"><span>/ documentation</span></ctx>
      </a>
      <div class="header-actions">
        <ctx :if="$build.development.not()">
          <pagefind-modal-trigger class="site-search" placeholder="Search docs"></pagefind-modal-trigger>
        </ctx>
        <button class="theme-toggle" type="button" aria-label="Night mode" aria-pressed="true" title="Night mode" hidden></button>
        <button class="mobile-navigation-button mobile-navigation-trigger" type="button"
                aria-label="Open navigation" aria-haspopup="dialog" aria-controls="mobile-navigation" aria-expanded="false" hidden></button>
      </div>
    </div>
    <ctx :if="$site.index().isCurrent().not()" catalog="$site.asset('docs-navigation.ziggy').ziggy()"
         section="$page.custom.getOr('doc_section', 'User Guide')"
         zml="$page.link().startsWith($site.page('zml').link())"
         llmd="$page.link().startsWith($site.page('llmd').link())"
         reference="$site.page($page.custom.getOr('reference_source', '')).custom">
      <nav class="page-width product-tabs" aria-label="Product documentation">
        <ctx :loop="$ctx.catalog.get($ctx.zml.then('zml', 'llmd'))">
          <ctx :if="$loop.it.get('label').eql($ctx.section)">
            <ctx section_start="$loop.it.get('groups').at(0).get('pages').at(0).get('path')">
              <ctx zml_target="$site.page($ctx.zml.then($ctx.reference.getOr('zml_reference_path', 'zml'), 'zml'))"
                   llmd_target="$site.page($ctx.llmd.then($ctx.reference.getOr('llmd_reference_path', $ctx.section_start), 'llmd/user-guide'))">
                <a href="$ctx.zml_target.link()"
                   aria-current="$ctx.zml_target.isCurrent().then('page', $ctx.zml.then('location', 'false'))">ZML</a>
                <a href="$ctx.llmd_target.link()"
                   aria-current="$ctx.llmd_target.isCurrent().then('page', $ctx.llmd.then('location', 'false'))">LLMD</a>
              </ctx>
            </ctx>
          </ctx>
        </ctx>
      </nav>
      <ctx :if="$ctx.zml.or($ctx.llmd)">
        <div class="section-nav">
          <nav class="page-width section-tabs" aria-label="Documentation sections">
            <ctx :loop="$ctx.catalog.get($ctx.zml.then('zml', 'llmd'))">
              <ctx label="$loop.it.get('label')" target="$site.page($loop.it.get('groups').at(0).get('pages').at(0).get('path'))">
                <a href="$ctx.target.link()"
                   aria-current="$ctx.target.isCurrent().then('page', $ctx.label.eql($ctx.section).then('location', 'false'))">
                  <span :text="$ctx.label"></span>
                </a>
              </ctx>
            </ctx>
          </nav>
        </div>
      </ctx>
    </ctx>
  </header>
  <main id="site-content" class="$site.index().isCurrent().then('page-width', 'page-width docs-layout')" tabindex="-1">
    <ctx catalog="$site.asset('docs-navigation.ziggy').ziggy()"
         section="$page.custom.getOr('doc_section', 'User Guide')"
         zml="$page.link().startsWith($site.page('zml').link())"
         llmd="$page.link().startsWith($site.page('llmd').link())">
      <ctx :if="$ctx.zml.or($ctx.llmd)">
        <details class="docs-sidebar" open>
          <summary :text="$ctx.section.prefix('Pages in ')"></summary>
          <nav aria-label="Documentation sidebar">
            <ctx :loop="$ctx.catalog.get($ctx.zml.then('zml', 'llmd'))">
              <ctx :if="$loop.it.get('label').eql($ctx.section)" groups="$loop.it.get('groups')">
                <ctx :loop="$ctx.groups">
                  <div class="sidebar-group">
                    <p class="sidebar-heading" :text="$loop.it.get('label')"></p>
                    <ul>
                      <ctx :loop="$loop.it.get('pages')">
                        <ctx entry="$loop.it" target="$site.page($loop.it.get('path'))">
                          <li><a class="$ctx.entry.get('icon')" href="$ctx.target.link()"
                                 aria-current="$ctx.target.isCurrent().then('page', 'false')" :text="$ctx.entry.get('label')"></a></li>
                        </ctx>
                      </ctx>
                    </ul>
                  </div>
                </ctx>
              </ctx>
            </ctx>
          </nav>
        </details>
      </ctx>
    </ctx>
    <super>
  </main>
  <footer class="site-footer page-width">
    <span>ZML documentation</span>
    <ctx :if="$site.index().isCurrent().not()">
      <a href="https://zml.ai/">ZML website</a>
      <a href="https://zine-ssg.io/">Built with Zine</a>
    </ctx>
    <a href="https://github.com/zml/zml" :text="$site.index().isCurrent().then('GitHub', 'ZML source')"></a>
  </footer>
  <dialog id="mobile-navigation" class="mobile-navigation" aria-labelledby="mobile-navigation-title" data-pagefind-ignore>
    <div class="mobile-navigation-header">
      <h2 id="mobile-navigation-title">Navigation</h2>
      <form method="dialog">
        <button class="mobile-navigation-button mobile-navigation-close" type="submit" aria-label="Close navigation" autofocus></button>
      </form>
    </div>
    <ctx catalog="$site.asset('docs-navigation.ziggy').ziggy()"
         section="$page.custom.getOr('doc_section', 'User Guide')"
         zml="$page.link().startsWith($site.page('zml').link())"
         llmd="$page.link().startsWith($site.page('llmd').link())">
      <nav class="mobile-navigation-overview" aria-label="Site navigation" data-mobile-overview>
        <div class="mobile-navigation-products" data-mobile-products></div>
        <ctx :if="$ctx.zml.or($ctx.llmd)">
          <ul class="mobile-navigation-sections">
            <ctx :loop="$ctx.catalog.get($ctx.zml.then('zml', 'llmd'))">
              <li><button type="button" data-mobile-section="$loop.it.get('label')"
                          aria-current="$loop.it.get('label').eql($ctx.section).then('location', 'false')"
                          :text="$loop.it.get('label')"></button></li>
            </ctx>
          </ul>
        </ctx>
      </nav>
      <ctx :if="$ctx.zml.or($ctx.llmd)">
        <ctx :loop="$ctx.catalog.get($ctx.zml.then('zml', 'llmd'))">
          <ctx label="$loop.it.get('label')" groups="$loop.it.get('groups')">
            <nav class="mobile-navigation-pages" data-mobile-pages="$ctx.label" aria-label="$ctx.label.prefix('Pages in ')" hidden>
              <button class="mobile-navigation-back" type="button" aria-label="Back to documentation sections">Sections</button>
              <h3 :text="$ctx.label"></h3>
              <ctx :loop="$ctx.groups">
                <div class="sidebar-group">
                  <ctx :if="$loop.first.not()">
                    <p class="sidebar-heading" :text="$loop.it.get('label')"></p>
                  </ctx>
                  <ul>
                    <ctx :loop="$loop.it.get('pages')">
                      <ctx entry="$loop.it" target="$site.page($loop.it.get('path'))">
                        <li><a class="$ctx.entry.get('icon')" href="$ctx.target.link()"
                               aria-current="$ctx.target.isCurrent().then('page', 'false')" :text="$ctx.entry.get('label')"></a></li>
                      </ctx>
                    </ctx>
                  </ul>
                </div>
              </ctx>
            </nav>
          </ctx>
        </ctx>
      </ctx>
    </ctx>
  </dialog>
  <ctx :if="$build.development.not()">
    <pagefind-modal class="site-search">
      <pagefind-modal-header>
        <pagefind-input></pagefind-input>
      </pagefind-modal-header>
      <pagefind-modal-body>
        <pagefind-summary default-message="Start typing to search the ZML and LLMD docs."></pagefind-summary>
        <pagefind-results>
          <script type="text/pagefind-template">
            <li class="pf-result">
              {{#if meta.exact_title}}<p class="search-result-exact-label">Exact page title</p>{{/if}}
              <div class="pf-result-card{{#if meta.exact_title}} search-result-exact{{/if}}">
                <div class="pf-result-content">
                  {{#if meta.search_context}}<p class="search-result-context">{{ meta.search_context }}</p>{{/if}}
                  <p class="pf-result-title">
                    <a class="pf-result-link" href='{{ meta.url | default(url) | safeUrl }}'>{{ meta.title }}</a>
                  </p>
                  {{#if excerpt}}<p class="pf-result-excerpt">{{+ excerpt +}}</p>{{/if}}
                </div>
              </div>
              {{#if sub_results}}
              <ul class="pf-heading-chips">
                {{#each sub_results as sub}}
                <li class="pf-heading-chip">
                  <a class="pf-heading-link" href='{{ sub.url | safeUrl }}'>{{ sub.title }}</a>
                  <p class="pf-heading-excerpt">{{+ sub.excerpt +}}</p>
                </li>
                {{/each}}
              </ul>
              {{/if}}
            </li>
          </script>
        </pagefind-results>
      </pagefind-modal-body>
      <pagefind-modal-footer>
        <pagefind-keyboard-hints></pagefind-keyboard-hints>
      </pagefind-modal-footer>
    </pagefind-modal>
  </ctx>
</body>
</html>
