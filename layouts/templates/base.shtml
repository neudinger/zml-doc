<!DOCTYPE html>
<html lang="en">
<head id="site-head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="$site.asset('zml-mark.svg').link()">
  <script src="$site.asset('site-theme.js').link()"></script>
  <ctx :if="$build.development.not()">
    <link rel="stylesheet" href="$site.index().link().addPath('pagefind/pagefind-component-ui.css')">
    <script type="module" src="$site.index().link().addPath('pagefind/pagefind-component-ui.js')"></script>
  </ctx>
  <link rel="stylesheet" href="$site.asset('site.css').link()">
  <ctx :if="$site.index().isCurrent().not()">
    <script defer src="$site.asset('docs-navigation.js').link()"></script>
  </ctx>
  <super>
</head>
<body class="$site.index().isCurrent().then('homepage', '')" data-site-root="$site.index().link()">
  <a class="skip-link" href="#site-content">Skip to content</a>
  <ctx :if="$build.development.not()">
    <pagefind-config base-url="$site.index().link()" bundle-path="$site.index().link().addPath('pagefind/')"></pagefind-config>
  </ctx>
  <header class="site-header">
    <div class="page-width header-inner">
      <a class="brand" href="$site.index().link()" aria-label="ZML documentation home">
        <img src="$site.asset('zml-mark.svg').link()" alt="" width="32" height="32">
        <strong>ZML</strong> <span>/ documentation</span>
      </a>
      <div class="header-actions">
        <nav aria-label="Main navigation">
          <a href="$site.page('start').link()" aria-current="$site.page('start').isCurrent().then('page', 'false')">Start</a>
        </nav>
        <ctx :if="$build.development.not()">
          <pagefind-modal-trigger class="site-search" placeholder="Search docs"></pagefind-modal-trigger>
        </ctx>
        <button class="theme-toggle" type="button" aria-label="Night mode" aria-pressed="false" title="Night mode" hidden></button>
      </div>
    </div>
    <ctx catalog="$site.asset('docs-navigation.ziggy').ziggy()"
         section="$page.custom.getOr('doc_section', 'User Guide')"
         zml="$page.link().startsWith($site.page('zml').link())"
         llmd="$page.link().startsWith($site.page('llmd').link()).or($page.link().startsWith($site.page('operations').link()))"
         reference="$page.custom.getOr('reference_route', $page.custom.getOr('reference_source', ''))">
      <nav class="page-width product-tabs" aria-label="Product documentation">
        <ctx :loop="$ctx.catalog.get('sections')">
          <ctx :if="$loop.it.get('label').eql($ctx.section)">
            <ctx zml_target="$site.page($ctx.reference.eql('').then($loop.it.get('zml'), $ctx.reference.prefix('zml/')))"
                 llmd_target="$site.page($ctx.reference.eql('').then($loop.it.get('llmd'), $ctx.reference.prefix('llmd/')))">
              <a href="$ctx.zml_target.link()"
                 aria-current="$ctx.zml_target.isCurrent().then('page', $ctx.zml.then('location', 'false'))">ZML</a>
              <a href="$ctx.llmd_target.link()"
                 aria-current="$ctx.llmd_target.isCurrent().then('page', $ctx.llmd.then('location', 'false'))">LLMD</a>
            </ctx>
          </ctx>
        </ctx>
      </nav>
      <div class="section-nav" :if="$ctx.zml.or($ctx.llmd)">
        <nav class="page-width section-tabs" aria-label="Documentation sections">
          <ctx :loop="$ctx.catalog.get('sections')">
            <ctx tab="$loop.it" target="$site.page($loop.it.get($ctx.zml.then('zml', 'llmd')))">
              <a href="$ctx.target.link()" :text="$ctx.tab.get('label')"
                 aria-current="$ctx.target.isCurrent().then('page', $ctx.tab.get('label').eql($ctx.section).then('location', 'false'))"></a>
            </ctx>
          </ctx>
        </nav>
      </div>
    </ctx>
  </header>
  <main id="site-content" class="$site.index().isCurrent().then('page-width', 'page-width docs-layout')" tabindex="-1">
    <ctx catalog="$site.asset('docs-navigation.ziggy').ziggy()"
         section="$page.custom.getOr('doc_section', 'User Guide')"
         zml="$page.link().startsWith($site.page('zml').link())"
         llmd="$page.link().startsWith($site.page('llmd').link()).or($page.link().startsWith($site.page('operations').link()))">
      <details class="docs-sidebar" open :if="$ctx.zml.or($ctx.llmd)">
        <summary>Documentation navigation</summary>
        <nav aria-label="Documentation sidebar">
          <ctx :loop="$ctx.catalog.get('tracks')">
            <ctx :if="$loop.it.get('track').eql($ctx.zml.then('zml', 'llmd'))" pages="$loop.it.get('pages')">
              <ctx :loop="$ctx.catalog.get('sections')">
                <ctx :if="$loop.it.get('label').eql($ctx.section)" groups="$loop.it.getOr($ctx.llmd.then('llmd_groups', 'groups'), $loop.it.get('groups'))">
                  <ctx :loop="$ctx.groups">
                    <div class="sidebar-group">
                      <p class="sidebar-heading" :text="$loop.it"></p>
                      <ul>
                        <ctx group="$loop.it" :loop="$ctx.pages">
                          <ctx entry="$loop.it" target="$site.page($loop.it.get('path'))">
                            <ctx :if="$ctx.entry.getOr('group', $ctx.target.custom.getOr('doc_section', 'User Guide')).eql($ctx.group)">
                              <ctx :if="$ctx.entry.has('topics').not()">
                                <li><a class="$ctx.entry.get('icon')" href="$ctx.target.link()"
                                       aria-current="$ctx.target.isCurrent().then('page', 'false')" :text="$ctx.entry.get('label')"></a></li>
                              </ctx>
                              <ctx :if="$ctx.entry.get?('topics')">
                                <ctx :loop="$if">
                                  <li><a class="$loop.it.get('icon')" href="$ctx.target.linkRef($loop.it.get('id'))"
                                         aria-current="$ctx.target.isCurrent().and($loop.first).then('location', 'false')" :text="$loop.it.get('label')"></a></li>
                                </ctx>
                              </ctx>
                            </ctx>
                          </ctx>
                        </ctx>
                      </ul>
                    </div>
                  </ctx>
                </ctx>
              </ctx>
            </ctx>
          </ctx>
        </nav>
      </details>
    </ctx>
    <super>
  </main>
  <footer class="site-footer page-width">
    <span>ZML documentation</span>
    <a href="https://zml.ai/">ZML website</a>
    <a href="https://github.com/zml/zml">ZML source</a>
    <a href="https://zine-ssg.io/">Built with Zine</a>
  </footer>
  <ctx :if="$build.development.not()">
    <pagefind-modal class="site-search"></pagefind-modal>
  </ctx>
</body>
</html>
