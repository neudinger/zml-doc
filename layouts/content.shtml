<extend template="base.shtml">
<head id="site-head">
  <ctx :if="$page.content().contains('data-bazel-target=')">
    <script defer src="$site.asset('bazel-platforms.js').link()"></script>
  </ctx>
  <ctx :if="$page.content().contains('<pre><code')">
    <script defer src="$site.asset('code-copy.js').link()"></script>
  </ctx>
  <ctx :if="$page.content().contains('<pre><code class=')">
    <script defer data-manual src="$site.asset('prism/prism.min.js').link()"></script>
    <script defer src="$site.asset('code-highlight.js').link()"></script>
  </ctx>
  <ctx :if="$page.content().contains('data-llmd-launch')">
    <script defer src="$site.asset('llmd-launch.js').link()"></script>
  </ctx>
  <ctx :if="$page.content().contains('data-model-catalog')">
    <script defer src="$site.asset('model-catalog.js').link()"></script>
  </ctx>
</head>
<main id="site-content">
  <article class="document">
    <header class="document-header">
      <p class="eyebrow">ZML / LLMD</p>
      <h1 :text="$page.title"></h1>
      <p class="description" :text="$page.description"></p>
    </header>
    <ctx :if="$site.index().isCurrent().not()">
      <ctx toc="$page.toc()">
        <ctx :if="$ctx.toc.contains('href=')">
          <nav class="page-toc" aria-labelledby="page-toc-heading">
            <p id="page-toc-heading">On this page</p>
            <div :html="$ctx.toc"></div>
          </nav>
        </ctx>
      </ctx>
      <div class="prose" data-pagefind-body :html="$page.content()"></div>
      <ctx :loop="$site.asset('docs-navigation.ziggy').ziggy()">
        <ctx pages="$loop.it.get('pages')">
          <ctx :loop="$ctx.pages">
            <ctx :if="$site.page($loop.it.get('path')).isCurrent()">
              <nav id="next-steps" class="article-pager" aria-label="Previous and next pages" data-pagefind-ignore>
                <ctx :if="$loop.first.not()">
                  <ctx previous="$site.page($ctx.pages.at($loop.idx.minus(2)).get('path'))">
                    <a rel="prev" href="$ctx.previous.link()">
                      <span class="pager-direction"><span aria-hidden="true">←</span> Previous</span>
                      <strong :text="$ctx.previous.title"></strong>
                    </a>
                  </ctx>
                </ctx>
                <ctx :if="$loop.last.not()">
                  <ctx next="$site.page($ctx.pages.at($loop.idx).get('path'))">
                    <a rel="next" href="$ctx.next.link()">
                      <span class="pager-direction">Next <span aria-hidden="true">→</span></span>
                      <strong :text="$ctx.next.title"></strong>
                    </a>
                  </ctx>
                </ctx>
              </nav>
            </ctx>
          </ctx>
        </ctx>
      </ctx>
    </ctx>
    <ctx :if="$site.index().isCurrent()">
      <div class="prose" :html="$page.content()"></div>
    </ctx>
  </article>
</main>
