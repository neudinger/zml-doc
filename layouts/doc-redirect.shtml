<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Documentation page moved</title>
  <link rel="canonical" href="$site.page($page.custom.get('destination')).link()">
  <link rel="stylesheet" href="$site.asset('site.css').link()">
  <script src="$site.asset('site-theme.js').link()"></script>
  <script defer src="$site.asset('doc-redirect.js').link()"></script>
</head>
<body>
  <main class="page-width document" data-pagefind-ignore>
    <h1>Documentation page moved</h1>
    <p><a data-doc-redirect href="$site.page($page.custom.get('destination')).link()">Continue to the page</a></p>
    <ctx :if="$page.custom.get?('anchors')">
      <ul>
        <ctx :loop="$if">
          <li><a id="$loop.it.get('from')" data-legacy-fragment
                 href="$site.page($loop.it.getOr('path', $page.custom.get('destination'))).link().suffix('#', $loop.it.get('to'))"
                 :text="$loop.it.get('label')"></a></li>
        </ctx>
      </ul>
    </ctx>
  </main>
</body>
</html>
