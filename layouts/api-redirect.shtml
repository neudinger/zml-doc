<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title :text="$page.title"></title>
  <link rel="canonical" href="$site.page($page.custom.get('anchors').at(0).get('path')).link()">
  <link rel="stylesheet" href="$site.asset('site.css').link()">
  <script src="$site.asset('site-theme.js').link()"></script>
  <script defer src="$site.asset('api-redirect.js').link()"></script>
</head>
<body>
  <main class="page-width document" data-pagefind-ignore>
    <h1 :text="$page.title"></h1>
    <p>Choose a reference topic to continue.</p>
    <ul data-api-destinations>
      <ctx :loop="$page.custom.get('anchors')">
        <li><a id="$loop.it.get('id')" href="$site.page($loop.it.get('path')).linkRef($loop.it.get('id'))" :text="$loop.it.get('label')"></a></li>
      </ctx>
    </ul>
  </main>
</body>
</html>
